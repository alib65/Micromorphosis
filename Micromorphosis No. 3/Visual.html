<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred Geometry - Massive Reactive Pages</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { margin: 0; background: #ffffff; overflow: hidden; width: 100vw; height: 100vh; cursor: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }
</style>
</head>
<body>
<script>
(function() {

const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
let zoomTimeRemaining = 0;
let zoomTargetSpeed = 0;

window.addEventListener('keydown', e => { 
  if (e.key in keys) { e.preventDefault(); keys[e.key] = true; }
  if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); }
  if (e.key.toLowerCase() === 'z') { zoomTimeRemaining = 30; zoomTargetSpeed = (100 - spherical.radius) / 30; }
  if (e.key.toLowerCase() === 'x') { zoomTimeRemaining = 30; zoomTargetSpeed = (1500 - spherical.radius) / 30; }
});
window.addEventListener('keyup', e => { if (e.key in keys) keys[e.key] = false; });

let scData = { tension: 0.0, motion: 0.0, mode: 0.0, amp: 0.0 };

try {
  const socket = new WebSocket('ws://localhost:8080');
  socket.onmessage = (e) => {
    if (typeof e.data === 'string' && e.data.startsWith("LOG:")) return; 
    const data = e.data.split(',');
    scData.tension = parseFloat(data[0]) || 0;
    scData.motion  = parseFloat(data[1]) || 0;
    scData.mode    = parseFloat(data[2]) || 0;
    scData.amp     = parseFloat(data[3]) || 0;
  };
} catch(e) { console.log('WebSocket not connected'); }

const smoothed = { amp: 0, tension: 0, motion: 0, mode: 0 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const systemGroup = new THREE.Group();
scene.add(systemGroup);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 8000);
camera.position.set(0, 0, 1500); // Pulled camera back slightly to accommodate larger shapes

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let isDragging = false, prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0, phi: Math.PI / 2, radius: 1500 };

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  spherical.theta -= (e.clientX - prevMouse.x) * 0.005;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + (e.clientY - prevMouse.y) * 0.005));
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
  zoomTimeRemaining = 0; spherical.radius = Math.max(100, Math.min(4000, spherical.radius + e.deltaY * 0.5));
});

// MATHEMATICAL SETUP
const NUM_PAGES = 100;
const POINTS_PER_PAGE = 40; 
const PARTICLE_COUNT = NUM_PAGES * POINTS_PER_PAGE;
const PHI = (1 + Math.sqrt(5)) / 2; 
const GOLDEN_GROWTH = Math.log(PHI) / (Math.PI / 2);

const positions = new Float32Array(PARTICLE_COUNT * 3);
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0x000000, size: 2.5, transparent: true, opacity: 0.9, blending: THREE.NormalBlending, sizeAttenuation: true
});
const points = new THREE.Points(particleGeo, particleMat);
systemGroup.add(points);

// DATA STRUCTURE FOR RANDOM PAGES
const pagesData = [];
const areaSpread = 2000; // Increased spread to fit the larger pages
for(let p = 0; p < NUM_PAGES; p++) {
  pagesData.push({
    baseX: (Math.random() - 0.5) * areaSpread,
    baseY: (Math.random() - 0.5) * areaSpread,
    baseZ: (Math.random() - 0.5) * areaSpread,
    rotX: Math.random() * Math.PI * 2,
    rotY: Math.random() * Math.PI * 2,
    rotZ: Math.random() * Math.PI * 2,
    phase: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.02
  });
}

// LAYER 1: FIXED SPIRAL LINES (Inner Page Geometry)
const fixedIndices = [];
for(let p = 0; p < NUM_PAGES; p++) {
  for(let i = 0; i < POINTS_PER_PAGE - 1; i++) {
    let curr = p * POINTS_PER_PAGE + i;
    fixedIndices.push(curr, curr + 1);
  }
}
const fixedLineGeo = new THREE.BufferGeometry();
fixedLineGeo.setAttribute('position', particleGeo.attributes.position); 
fixedLineGeo.setIndex(fixedIndices);
const fixedLineSegments = new THREE.LineSegments(fixedLineGeo, new THREE.LineBasicMaterial({
  color: 0x000000, transparent: true, opacity: 0.4, blending: THREE.NormalBlending, depthWrite: false
}));
systemGroup.add(fixedLineSegments);

// LAYER 2: AUDIO REACTIVE DYNAMIC LINES (Between Pages)
const MAX_CONN = 8; // Increased maximum connections for a denser audio web
const dynamicLineArr = new Float32Array(PARTICLE_COUNT * MAX_CONN * 6);
const dynamicLineGeo = new THREE.BufferGeometry();
dynamicLineGeo.setAttribute('position', new THREE.BufferAttribute(dynamicLineArr, 3));
const dynamicLineSegments = new THREE.LineSegments(dynamicLineGeo, new THREE.LineBasicMaterial({
  color: 0x000000, transparent: true, opacity: 0.15, blending: THREE.NormalBlending, depthWrite: false
}));
systemGroup.add(dynamicLineSegments);
const particleConnCount = new Int32Array(PARTICLE_COUNT);

let time = 0;
const transformMatrix = new THREE.Matrix4();
const dummyObj = new THREE.Object3D();

function animate() {
  requestAnimationFrame(animate);
  time += 0.005;
  const dt = 0.016; 

  if (zoomTimeRemaining > 0) {
    spherical.radius += zoomTargetSpeed * dt;
    zoomTimeRemaining -= dt;
    spherical.radius = Math.max(100, Math.min(4000, spherical.radius));
  }

  smoothed.amp     += (scData.amp     - smoothed.amp)     * 0.3;
  smoothed.tension += (scData.tension - smoothed.tension) * 0.15;
  smoothed.motion  += (scData.motion  - smoothed.motion)  * 0.1;
  smoothed.mode    += (scData.mode    - smoothed.mode)    * 0.1;

  camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.radius * Math.cos(spherical.phi);
  camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(systemGroup.position);

  const posArr = particleGeo.attributes.position.array;

  // 1. UPDATE RANDOM PAGES & SPIRALS
  for(let p = 0; p < NUM_PAGES; p++) {
    const page = pagesData[p];
    
    // Increased scale reaction to audio to make the big pages breathe heavily
    const audioScale = 1.0 + smoothed.amp * 2.5 + (Math.sin(time * 3 + page.phase) * smoothed.motion);
    const audioRotSpeed = page.rotSpeed * (1 + smoothed.tension * 5);
    
    dummyObj.position.set(page.baseX, page.baseY, page.baseZ);
    dummyObj.rotation.set(
      page.rotX + time * audioRotSpeed,
      page.rotY + time * audioRotSpeed * 1.5,
      page.rotZ + time * audioRotSpeed * 0.5
    );
    dummyObj.scale.set(audioScale, audioScale, audioScale);
    dummyObj.updateMatrix();

    for(let i = 0; i < POINTS_PER_PAGE; i++) {
      let idx = p * POINTS_PER_PAGE + i;
      particleConnCount[idx] = 0; // Reset connections
      
      // MATHEMATICAL CHANGE: Multiply the base radius by 5.0 to make the spirals huge
      let theta = i * 0.35; 
      let radius = 5.0 * Math.exp(GOLDEN_GROWTH * theta); 
      
      // Apply 2D spiral point to the 3D Random Page Transformation
      let localVec = new THREE.Vector3(radius * Math.cos(theta), radius * Math.sin(theta), 0);
      localVec.applyMatrix4(dummyObj.matrix);

      posArr[idx * 3]     = localVec.x;
      posArr[idx * 3 + 1] = localVec.y;
      posArr[idx * 3 + 2] = localVec.z;
    }
  }
  
  particleGeo.attributes.position.needsUpdate = true;
  fixedLineGeo.attributes.position.needsUpdate = true;

  // 2. CALCULATE AUDIO-REACTIVE DISTANCE CONNECTIONS
  // Massive increase in base distance so the larger pages can reach each other
  const baseDist = 300 + smoothed.amp * 800; 
  const DIST_SQ = baseDist * baseDist;
  let li = 0, numConn = 0;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    if (particleConnCount[i] >= MAX_CONN) continue;
    
    for (let j = i + 1; j < PARTICLE_COUNT; j++) {
      if (particleConnCount[j] >= MAX_CONN) continue;
      
      // Skip points on the SAME page to keep the dynamic lines exclusively bridging the gaps
      if (Math.floor(i / POINTS_PER_PAGE) === Math.floor(j / POINTS_PER_PAGE)) continue;

      const dx = posArr[i*3] - posArr[j*3];
      const dy = posArr[i*3+1] - posArr[j*3+1];
      const dz = posArr[i*3+2] - posArr[j*3+2];
      
      if (dx*dx + dy*dy + dz*dz < DIST_SQ) {
        particleConnCount[i]++; 
        particleConnCount[j]++;
        
        dynamicLineArr[li++] = posArr[i*3];   dynamicLineArr[li++] = posArr[i*3+1]; dynamicLineArr[li++] = posArr[i*3+2];
        dynamicLineArr[li++] = posArr[j*3];   dynamicLineArr[li++] = posArr[j*3+1]; dynamicLineArr[li++] = posArr[j*3+2];
        numConn++;
        
        if (li >= dynamicLineArr.length - 6) { i = PARTICLE_COUNT; break; }
      }
    }
  }
  
  dynamicLineGeo.attributes.position.needsUpdate = true;
  dynamicLineGeo.setDrawRange(0, numConn * 2);

  // Thicker lines and larger points when the sound peaks
  dynamicLineSegments.material.opacity = 0.08 + smoothed.amp * 0.6;
  particleMat.size = 2.5 + smoothed.amp * 5.0;

  // Keyboard Rotation
  if (keys.ArrowUp)   { systemGroup.rotation.x -= 0.01; }
  if (keys.ArrowDown) { systemGroup.rotation.x += 0.01; }
  if (keys.ArrowLeft) { systemGroup.rotation.y -= 0.01; }
  if (keys.ArrowRight){ systemGroup.rotation.y += 0.01; }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

})();
</script>
</body>
</html>
